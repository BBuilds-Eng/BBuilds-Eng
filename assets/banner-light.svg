<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="BBuilds — Engineering Studio">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F4F8F6"/>
      <stop offset="1" stop-color="#EEF4F1"/>
    </linearGradient>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridL" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#047857" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="url(#bgL)"/>
  <rect width="1280" height="320" fill="url(#gridL)"/>
  <ellipse cx="180" cy="170" rx="360" ry="180" fill="url(#glowL)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentL)"/>

  <!-- faint watermark -->
  <text x="1180" y="268" text-anchor="end" font-family="'SF Mono','Cascadia Code',Menlo,Consolas,'Courier New',monospace" font-size="170" font-weight="bold" fill="#047857" fill-opacity="0.05">{ }</text>

  <!-- monogram chip -->
  <rect x="72" y="100" width="124" height="124" rx="28" fill="#FFFFFF" stroke="url(#accentL)" stroke-width="3"/>
  <text x="134" y="163" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="bold" fill="url(#accentL)">BB</text>

  <!-- wordmark -->
  <text x="224" y="152" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="74" font-weight="bold" fill="#0C1512" letter-spacing="1">BBuilds</text>
  <text x="226" y="196" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="bold" fill="#047857" letter-spacing="11">ENGINEERING STUDIO</text>

  <!-- tagline -->
  <text x="226" y="252" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="29" fill="#5D7168">We build software that endures.</text>

  <!-- domain chip -->
  <rect x="1006" y="230" width="186" height="46" rx="23" fill="#FFFFFF" stroke="#A9D6C3" stroke-width="1.5"/>
  <circle cx="1030" cy="253" r="6" fill="#10B981"/>
  <text x="1108" y="254" text-anchor="middle" dominant-baseline="central" font-family="'SF Mono','Cascadia Code',Menlo,Consolas,'Courier New',monospace" font-size="20" fill="#047857">bbuilds.org</text>
</svg>
