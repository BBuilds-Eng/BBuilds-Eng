<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="BBuilds — Engineering Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A100D"/>
      <stop offset="0.55" stop-color="#0E1511"/>
      <stop offset="1" stop-color="#0A0F0C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#10B981" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <ellipse cx="180" cy="170" rx="360" ry="180" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <!-- faint watermark -->
  <text x="1180" y="268" text-anchor="end" font-family="'SF Mono','Cascadia Code',Menlo,Consolas,'Courier New',monospace" font-size="170" font-weight="bold" fill="#10B981" fill-opacity="0.06">{ }</text>

  <!-- monogram chip -->
  <rect x="72" y="100" width="124" height="124" rx="28" fill="#0D1713" stroke="url(#accent)" stroke-width="3"/>
  <text x="134" y="163" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="bold" fill="url(#accent)">BB</text>

  <!-- wordmark -->
  <text x="224" y="152" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="74" font-weight="bold" fill="#F2FBF7" letter-spacing="1">BBuilds</text>
  <text x="226" y="196" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="bold" fill="#10B981" letter-spacing="11">ENGINEERING STUDIO</text>

  <!-- tagline -->
  <text x="226" y="252" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="29" fill="#A3B8AC">We build software that endures.</text>

  <!-- domain chip -->
  <rect x="1006" y="230" width="186" height="46" rx="23" fill="#0D1712" stroke="#1E3B2F" stroke-width="1.5"/>
  <circle cx="1030" cy="253" r="6" fill="#34D399"/>
  <text x="1108" y="254" text-anchor="middle" dominant-baseline="central" font-family="'SF Mono','Cascadia Code',Menlo,Consolas,'Courier New',monospace" font-size="20" fill="#34D399">bbuilds.org</text>
</svg>
